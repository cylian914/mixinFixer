plugins {
    id("earth.terrarium.cloche") version "0.19.13"
    id("maven-publish")
}

group = 'tess.mc.util'
version = '1.0.0'

repositories {
    cloche.librariesMinecraft()

    mavenCentral()

    cloche {
        main() // General multiplatform or configuration libraries, generally not needed in single-target neoforge

        // Neoforge specific mavens (if neoforge targets are added)
        mavenNeoforgedMeta()
        mavenNeoforged(/* releases */)

        mavenFabric() // maven.fabricmc.net (if fabric targets are added)
        mavenForge() // maven.minecraftforge.net (if forge targets are added)

        mavenParchment() // maven.parchmentmc.org (if parchment is used)
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.bawnorton.com/releases"
            }
        }
        filter {
            includeGroup "com.github.bawnorton.mixinsquared"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Terraformers"
                url = "https://maven.terraformersmc.com/"
            }
        }
        filter {
            includeGroup "com.terraformersmc"
        }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    url = "https://maven.ryanhcode.dev/releases"
                    name = "RyanHCode Maven"
                }
        )
        filter {
            includeGroup "dev.ryanhcode.sable"
            includeGroup "dev.ryanhcode.sable-companion"
        }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'BlameJared'
                    url = 'https://maven.blamejared.com'
                }
        )
        filter {
            includeGroup "foundry.veil"
            includeGroup "gg.moonflower"
            includeGroup "io.github.ocelot"
        }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = "Fuzs Mod Resources"
                    url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
                }
        )
        filter {
            includeGroup "fuzs.forgeconfigapiport"
        }
    }
    exclusiveContent {
        forRepositories(
                maven { url = "https://maven.createmod.net" }, // Create, Ponder, Flywheel
                maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
        )
        filter {
            includeGroup "com.simibubi.create"
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
            includeGroup "com.tterrag.registrate"
        }
    }
}

cloche {
    metadata {
        // Automatically generate mod metadata file
        modId = "mixin_fixer"
        name = "Mixin Fixer"
        description = "Automatically fix some compatibility issue with how some mixin are written"
        license = "CC BY-NC-SA 4.0"

        author("Tess")
        icon = "asset/logo.png"
    }
    minecraftVersion = "1.21.1"

    mappings {
        official()
        parchment("2024.11.17")
    }

    common {
        mixins.from(
                "src/main/resources/mixinFixer.mixin.json"
        )

        dependencies {
            annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${project.mixinsquared_version}")
            compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-common:${project.mixinsquared_version}")
            implementation("dev.ryanhcode.sable:sable-sable_rapier-${"1.21.1"}:${project.sable_version}")
        }
    }

    neoforge {
        loaderVersion = "21.1.228"
        dependencies {
            include("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${project.mixinsquared_version}")
            implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${project.mixinsquared_version}")
            modRuntimeOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:${project.sable_version}")
        }
        runs {
            client()
        }
    }

    fabric {
        includedClient()

        loaderVersion = "0.19.5"
        dependencies {
            annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixinsquared_version}")
            implementation("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixinsquared_version}")
            modRuntimeOnly("com.terraformersmc:modmenu:11.0.5")
            modImplementation("com.terraformersmc:modmenu:11.0.5")
            modImplementation("net.fabricmc.fabric-api:fabric-api:0.116.18+1.21.1")
            modRuntimeOnly("dev.ryanhcode.sable:sable-fabric-1.21.1:${project.sable_version}")

        }

        runs {
            client()
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}